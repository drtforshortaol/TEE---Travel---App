name: Deploy TEE v3.4.00

on:
  push:
    paths:
      - ".github/workflows/tee-deploy-v3400.yml"

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify TEE public-safe update
        shell: bash
        run: |
          cat .tee-deploy/v3400-part00.b64 \
              .tee-deploy/v3400-seg00.b64 \
              .tee-deploy/v3400-seg01.b64 \
              .tee-deploy/v3400-seg02.b64 \
              .tee-deploy/v3400-seg03.b64 \
              .tee-deploy/v3400-seg04.b64 \
              .tee-deploy/v3400-seg05.b64 \
              .tee-deploy/v3400-seg06.b64 \
              .tee-deploy/v3400-seg07.b64 > /tmp/tee-v3400.b64
          test "$(wc -c < /tmp/tee-v3400.b64)" -eq 53528
          base64 --decode /tmp/tee-v3400.b64 > /tmp/tee-v3400.zip
          unzip -t /tmp/tee-v3400.zip
          unzip -o /tmp/tee-v3400.zip -d .
          rm -rf .tee-deploy

      - name: Commit TEE v3.4.00
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes to commit."
            exit 0
          fi
          git commit -m "Publish TEE v3.4.00 public-safe mobile update"
          git push origin HEAD:main
